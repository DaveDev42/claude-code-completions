name: Refresh completions from latest Claude Code

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly: Mondays at 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Record version
        id: version
        run: |
          VERSION="$(claude --version)"
          echo "claude_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected: $VERSION"

      - name: Audit overrides against latest --help
        id: audit
        run: |
          set +e
          out=$(node bin/claude-code-completions.js audit --no-exit)
          echo "$out"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Regenerate completions
        run: node bin/claude-code-completions.js generate --all --out completions

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet completions/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh completions for ${{ steps.version.outputs.claude_version }}"
          title: "chore: refresh completions for ${{ steps.version.outputs.claude_version }}"
          body: |
            Automated refresh of pre-generated completions against the latest Claude Code release.

            Claude Code version: `${{ steps.version.outputs.claude_version }}`

            <details><summary>overrides audit</summary>

            ```
            ${{ steps.audit.outputs.report }}
            ```
            </details>
          branch: auto/refresh-completions
          delete-branch: true
          add-paths: completions/
